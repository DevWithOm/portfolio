<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Skills — Moves learned by Om Vyas on his web development journey.">
    <title>Om Vyas | Skills</title>
    <link rel="icon" type="image/png" href="assets/pokeball_favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="transitions.css">
</head>
<body data-page="skills">

    <div id="page-transition" class="page-transition" aria-hidden="true">
        <div class="transition-pokeball-icon"></div>
    </div>
    <div id="particles-container" aria-hidden="true"></div>

    <nav id="main-nav">
        <a href="index.html" data-page="home" class="nav-logo">
            <div class="pokeball-icon-small"></div>
            <span>OM.DEV</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html" data-page="home">Home</a></li>
            <li><a href="about.html" data-page="about">About</a></li>
            <li><a href="skills.html" data-page="skills">Skills</a></li>
            <li><a href="projects.html" data-page="projects">Projects</a></li>
            <li><a href="journey.html" data-page="journey">Journey</a></li>
            <li><a href="contact.html" data-page="contact">Contact</a></li>
        </ul>
        <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <main id="page-content">
        <section id="skills" class="section page-section">
            <div class="container">
                <div class="section-header">
                    <div class="pokeball-icon-small"></div>
                    <h2>Skills</h2>
                </div>
                <p class="section-subtitle">Moves Learned So Far</p>
                <div class="skills-grid">
                    <div class="skill-badge type-normal">
                        <div class="badge-icon">📄</div>
                        <span class="badge-name">HTML</span>
                        <span class="badge-type">NORMAL</span>
                        <div class="badge-bar" role="progressbar" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100" aria-label="HTML skill level">
                            <div class="badge-fill" data-level="85"></div>
                        </div>
                    </div>
                    <div class="skill-badge type-water">
                        <div class="badge-icon">🌊</div>
                        <span class="badge-name">CSS</span>
                        <span class="badge-type">WATER</span>
                        <div class="badge-bar" role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" aria-label="CSS skill level">
                            <div class="badge-fill" data-level="40"></div>
                        </div>
                        <span class="badge-status">Learning</span>
                    </div>
                    <div class="skill-badge type-electric">
                        <div class="badge-icon">⚡</div>
                        <span class="badge-name">JavaScript</span>
                        <span class="badge-type">ELECTRIC</span>
                        <div class="badge-bar" role="progressbar" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100" aria-label="JavaScript skill level">
                            <div class="badge-fill" data-level="35"></div>
                        </div>
                        <span class="badge-status">Learning</span>
                    </div>
                    <div class="skill-badge type-poison">
                        <div class="badge-icon">🐍</div>
                        <span class="badge-name">Python</span>
                        <span class="badge-type">POISON</span>
                        <div class="badge-bar" role="progressbar" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100" aria-label="Python skill level">
                            <div class="badge-fill" data-level="65"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="main-footer">
        <div class="footer-pokeball-divider">
            <div class="divider-line"></div>
            <div class="pokeball-css small"></div>
            <div class="divider-line"></div>
        </div>
        <p class="footer-text">© 2026 Om Vyas — Gotta Code 'Em All!</p>
        <p class="footer-sub">Built with ❤️ and a love for Pokémon</p>
    </footer>

    <script src="script.js"></script>
    <script src="router.js"></script>
</body>
</html>
