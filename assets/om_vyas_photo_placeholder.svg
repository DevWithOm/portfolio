<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />

  <!-- Subtle Circuit / Neural Grid Lines -->
  <g stroke="#38BDF8" stroke-width="1" stroke-opacity="0.15" fill="none">
    <circle cx="200" cy="180" r="140" stroke-dasharray="6 6" />
    <circle cx="200" cy="180" r="110" />
    <line x1="60" y1="200" x2="340" y2="200" stroke-dasharray="4 4" />
    <line x1="200" y1="40" x2="200" y2="360" stroke-dasharray="4 4" />
    <path d="M 120 120 L 140 140 L 170 140" />
    <circle cx="170" cy="140" r="3" fill="#38BDF8" fill-opacity="0.4" />
    <path d="M 280 120 L 260 140 L 230 140" />
    <circle cx="230" cy="140" r="3" fill="#38BDF8" fill-opacity="0.4" />
  </g>

  <!-- Developer Silhouette / Stylized Portrait -->
  <!-- Shoulders & Torso -->
  <path d="M 100 370 C 100 295, 145 270, 200 270 C 255 270, 300 295, 300 370 Z" fill="url(#avatarGrad)" />
  <!-- Collar / Blazer lapels -->
  <path d="M 175 270 L 200 320 L 225 270 Z" fill="#0F172A" opacity="0.6" />
  <path d="M 190 320 L 200 370 L 210 320 Z" fill="#38BDF8" opacity="0.8" />

  <!-- Neck -->
  <rect x="182" y="225" width="36" height="50" rx="10" fill="#F8FAFC" opacity="0.9" />

  <!-- Head -->
  <ellipse cx="200" cy="175" rx="52" ry="60" fill="#F8FAFC" />

  <!-- Modern Hair -->
  <path d="M 148 165 C 145 125, 175 105, 200 105 C 230 105, 255 125, 252 165 C 245 130, 225 120, 200 120 C 175 120, 155 135, 148 165 Z" fill="#0F172A" />
  <path d="M 152 145 C 160 120, 195 110, 230 115 C 248 118, 255 130, 255 135 C 245 125, 230 122, 215 124 C 185 128, 165 140, 152 145 Z" fill="#1E293B" />

  <!-- Developer Glasses -->
  <g stroke="#0F172A" stroke-width="4" fill="none">
    <rect x="162" y="162" width="30" height="20" rx="6" fill="#38BDF8" fill-opacity="0.25" />
    <rect x="208" y="162" width="30" height="20" rx="6" fill="#38BDF8" fill-opacity="0.25" />
    <line x1="192" y1="172" x2="208" y2="172" />
    <line x1="152" y1="170" x2="162" y2="170" />
    <line x1="238" y1="170" x2="248" y2="170" />
  </g>

  <!-- Confident Smile -->
  <path d="M 188 208 Q 200 216 212 208" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Floating Tech Badges -->
  <g transform="translate(45, 45)" filter="url(#glow)">
    <rect width="90" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <text x="45" y="17" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="900" font-size="10" text-anchor="middle">AI / ML DEV</text>
  </g>

  <g transform="translate(265, 45)" filter="url(#glow)">
    <rect width="90" height="26" rx="13" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    <text x="45" y="17" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="900" font-size="10" text-anchor="middle">MITAOE</text>
  </g>

  <!-- Bottom Identity Bar -->
  <rect x="20" y="340" width="360" height="42" rx="16" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
  <text x="200" y="360" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="900" font-size="13" text-anchor="middle" letter-spacing="0.5">OM VYAS</text>
  <text x="200" y="374" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="600" font-size="9" text-anchor="middle">PHOTO PLACEHOLDER • CLICK TO UPDATE</text>
</svg>