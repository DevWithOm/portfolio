<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Night City V4.0 — 3D Asset Validation Studio</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0D1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #c9d1d9;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(13, 17, 23, 0.92);
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 18px;
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
      max-width: 440px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    }
    #hud h1 {
      margin: 0 0 6px 0;
      font-size: 13px;
      color: #00E5FF;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      margin-right: 4px;
    }
    .badge-view { background: #238636; color: #fff; }
    .badge-pass { background: #1f6feb; color: #fff; }
    .prop-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
    .prop-val { color: #f0f6fc; font-weight: 600; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/three/build/three.module.js",
        "three/addons/": "/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <h1 id="hud-title">Asset Validation Studio</h1>
    <div style="margin-bottom: 8px;">
      <span class="badge badge-view" id="badge-view">VIEW</span>
      <span class="badge badge-pass" id="badge-status">VALIDATED</span>
    </div>
    <div class="prop-row"><span>Asset:</span><span class="prop-val" id="val-asset">-</span></div>
    <div class="prop-row"><span>Dimensions:</span><span class="prop-val" id="val-dims">-</span></div>
    <div class="prop-row"><span>Triangles:</span><span class="prop-val" id="val-tris">-</span></div>
    <div class="prop-row"><span>Pivot min.Y:</span><span class="prop-val" id="val-pivot">-</span></div>
  </div>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const urlParams = new URLSearchParams(window.location.search);
    const modelName = urlParams.get('model') || 'corporate_skyscraper';
    const viewName = urlParams.get('view') || 'three_quarter';

    document.getElementById('badge-view').textContent = viewName.toUpperCase();
    document.getElementById('val-asset').textContent = modelName + '.glb';

    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e131b);

    const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // 3-Point Studio Lighting
    const keyLight = new THREE.DirectionalLight(0xfffaed, 2.2);
    keyLight.position.set(40, 60, 50);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x88ccee, 1.0);
    fillLight.position.set(-50, 30, 20);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 2.8);
    rimLight.position.set(0, 50, -60);
    scene.add(rimLight);

    const ambientLight = new THREE.AmbientLight(0x222a36, 0.9);
    scene.add(ambientLight);

    // Studio Circular Pedestal Grid
    const grid = new THREE.GridHelper(100, 50, 0x00E5FF, 0x1f2937);
    grid.position.y = -0.01;
    scene.add(grid);

    const shadowPlaneGeo = new THREE.PlaneGeometry(120, 120);
    const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.45 });
    const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.receiveShadow = true;
    scene.add(shadowPlane);

    // Load Model
    const loader = new GLTFLoader();
    loader.load('/models/' + modelName + '.glb', (gltf) => {
      const model = gltf.scene;

      let totalTris = 0;
      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          if (child.geometry) {
            const geom = child.geometry;
            if (geom.index) totalTris += geom.index.count / 3;
            else if (geom.attributes.position) totalTris += geom.attributes.position.count / 3;
          }
          if (viewName === 'wireframe') {
            child.material = new THREE.MeshBasicMaterial({
              color: 0x00E5FF,
              wireframe: true
            });
          }
        }
      });

      const bbox = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      bbox.getSize(size);
      const center = new THREE.Vector3();
      bbox.getCenter(center);

      document.getElementById('val-dims').textContent = `${size.x.toFixed(1)}m × ${size.y.toFixed(1)}m × ${size.z.toFixed(1)}m`;
      document.getElementById('val-tris').textContent = Math.round(totalTris).toLocaleString();
      document.getElementById('val-pivot').textContent = bbox.min.y.toFixed(2) + 'm (Ground Datum)';

      scene.add(model);

      // Camera positioning based on view and model size
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 1.85;

      if (viewName === 'front') {
        camera.position.set(0, center.y, dist);
        camera.lookAt(0, center.y, 0);
      } else if (viewName === 'side') {
        camera.position.set(dist, center.y, 0);
        camera.lookAt(0, center.y, 0);
      } else if (viewName === 'three_quarter' || viewName === 'wireframe') {
        camera.position.set(dist * 0.8, center.y + dist * 0.35, dist * 0.8);
        camera.lookAt(0, center.y * 0.9, 0);
      } else if (viewName === 'closeup') {
        camera.position.set(dist * 0.35, center.y * 1.3, dist * 0.45);
        camera.lookAt(0, center.y * 1.2, 0);
      }

      renderer.render(scene, camera);
      window.STUDIO_READY = true;
    }, undefined, (err) => {
      console.error('Error loading model in studio:', err);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
