<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#07090D" />
      <stop offset="100%" stop-color="#030407" />
    </radialGradient>
    <linearGradient id="cyberJacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0A0E17" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <linearGradient id="neonYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEE0A" />
      <stop offset="100%" stop-color="#E5D800" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#cyberBg)" />

  <!-- Hexagonal & Grid Overlay -->
  <g stroke="#1A222D" stroke-width="1" fill="none">
    <circle cx="200" cy="200" r="170" stroke="#00E5FF" stroke-opacity="0.1" stroke-dasharray="8 6" />
    <circle cx="200" cy="200" r="130" stroke="#FCEE0A" stroke-opacity="0.1" />
    <line x1="40" y1="200" x2="360" y2="200" stroke-opacity="0.15" />
    <line x1="200" y1="40" x2="200" y2="360" stroke-opacity="0.15" />
  </g>

  <!-- HUD Reticle / Targeting Marks -->
  <g stroke="#00E5FF" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 60 70 L 60 50 L 80 50" />
    <path d="M 320 50 L 340 50 L 340 70" />
    <path d="M 60 330 L 60 350 L 80 350" />
    <path d="M 320 350 L 340 350 L 340 330" />
    <text x="70" y="42" font-family="monospace" font-size="10" fill="#00E5FF" letter-spacing="2">NET_ID // 21</text>
    <text x="250" y="42" font-family="monospace" font-size="10" fill="#FCEE0A" letter-spacing="2">LOCK: ACQUIRED</text>
  </g>

  <!-- Shoulders & High-Collar Cyber Trench -->
  <path d="M 70 380 C 75 300, 130 260, 200 260 C 270 260, 325 300, 330 380 Z" fill="url(#cyberJacket)" stroke="#223042" stroke-width="2" />
  
  <!-- Cyber Collar with Yellow Warning Accent -->
  <path d="M 160 260 L 200 310 L 240 260 L 225 240 L 200 250 L 175 240 Z" fill="#111827" stroke="#FCEE0A" stroke-width="2" />
  <line x1="200" y1="310" x2="200" y2="380" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4 2" filter="url(#neonGlow)" />

  <!-- Tactical Shoulder Armor Pads -->
  <path d="M 75 340 L 120 320 L 115 380 L 70 380 Z" fill="#1E293B" stroke="#00E5FF" stroke-width="1" opacity="0.8" />
  <path d="M 325 340 L 280 320 L 285 380 L 330 380 Z" fill="#1E293B" stroke="#00E5FF" stroke-width="1" opacity="0.8" />

  <!-- Neck & Neural Implant Cables -->
  <rect x="182" y="215" width="36" height="45" rx="6" fill="#D4A373" />
  <path d="M 180 230 C 170 240, 165 255, 160 265" stroke="#00E5FF" stroke-width="2" fill="none" filter="url(#neonGlow)" />
  <path d="M 220 230 C 230 240, 235 255, 240 265" stroke="#FCEE0A" stroke-width="2" fill="none" filter="url(#neonGlow)" />

  <!-- Head -->
  <path d="M 150 160 C 150 100, 250 100, 250 160 C 250 205, 225 235, 200 235 C 175 235, 150 205, 150 160 Z" fill="#E2B182" />

  <!-- Cybernetic Headset / Audio Matrix on Left Ear -->
  <rect x="142" y="150" width="12" height="26" rx="4" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5" />
  <circle cx="148" cy="163" r="3" fill="#00E5FF" filter="url(#neonGlow)" />

  <!-- Modern Undercut Hair -->
  <path d="M 148 150 C 146 115, 170 85, 200 85 C 235 85, 256 110, 252 145 C 242 120, 220 115, 195 118 C 175 120, 158 135, 148 150 Z" fill="#18181B" />
  <path d="M 195 85 C 215 80, 238 95, 248 115 C 235 105, 218 102, 195 85 Z" fill="#27272A" />

  <!-- Optical HUD Visor / Cybernetic Eyes -->
  <path d="M 160 156 L 240 156 L 235 174 L 165 174 Z" fill="#080C14" stroke="#00E5FF" stroke-width="1.5" />
  <line x1="165" y1="165" x2="235" y2="165" stroke="#00E5FF" stroke-width="2" filter="url(#neonGlow)" />
  <circle cx="180" cy="165" r="2" fill="#FFFFFF" />
  <circle cx="220" cy="165" r="2" fill="#FFFFFF" />

  <!-- Nose & Mouth -->
  <path d="M 198 178 L 195 194 L 202 194" stroke="#B48256" stroke-width="1.5" fill="none" />
  <line x1="190" y1="210" x2="210" y2="210" stroke="#B48256" stroke-width="2" stroke-linecap="round" />

  <!-- Subtle Cyber Facial Data Scar -->
  <line x1="168" y1="182" x2="168" y2="198" stroke="#FCEE0A" stroke-width="1.2" stroke-dasharray="2 1" filter="url(#neonGlow)" />

  <!-- Frame Holographic Border -->
  <rect x="10" y="10" width="380" height="380" rx="4" fill="none" stroke="#1E293B" stroke-width="1" />
  <rect x="8" y="8" width="384" height="384" rx="6" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.3" />
</svg>

